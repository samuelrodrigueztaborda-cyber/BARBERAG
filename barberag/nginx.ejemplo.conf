# nginx.ejemplo.conf
#
# Configuración de ejemplo para servir BarberAg en producción con un solo
# dominio: nginx sirve los archivos estáticos del frontend directamente y
# reenvía ("proxy") todo lo que empiece por /api al backend de Node.js.
#
# Con este esquema, js/api.js detecta automáticamente que NO está en
# localhost y usa la ruta relativa "/api" — no hay que tocar nada más.
#
# Instalación típica en un VPS (Ubuntu):
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp nginx.ejemplo.conf /etc/nginx/sites-available/barberag
#   sudo ln -s /etc/nginx/sites-available/barberag /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tudominio.com   # activa HTTPS gratis (Let's Encrypt)

server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    # Archivos estáticos del frontend
    root /ruta/completa/a/barberag/frontend;
    index login.html index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Todo lo que empiece por /api se reenvía al backend Node.js
    # (que debe estar corriendo con PM2 o similar en el puerto 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
